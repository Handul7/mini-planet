name: Deploy to GitHub Pages

# Publishes the static site whenever main is updated.
# After the first run, enable Pages: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Sync public site metadata
        run: node scripts/sync-site-metadata.mjs
      - name: Validate public config and static app
        run: node scripts/validate-predeploy.mjs
      - name: Test dashboard contracts and release quality
        run: node --test tests/*.test.mjs
      - name: Build minimal Pages artifact
        run: node scripts/build-site.mjs
      - name: Validate Pages artifact boundary
        run: node scripts/validate-site-artifact.mjs _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Sync public site metadata
        run: node scripts/sync-site-metadata.mjs
      - name: Build minimal Pages artifact
        run: node scripts/build-site.mjs
      - name: Validate Pages artifact boundary
        run: node scripts/validate-site-artifact.mjs _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
