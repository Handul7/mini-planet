name: Check owner workspace changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/mini-planet-owner-dashboard]

permissions:
  contents: read

concurrency:
  group: owner-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/sync-site-metadata.mjs
      - run: node scripts/validate-predeploy.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -B -m unittest discover -s tests -p 'test_owner*.py' -v
      - run: node scripts/build-site.mjs
      - run: node scripts/validate-site-artifact.mjs _site
